<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AG-UI 最小 Demo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        max-width: 780px;
        margin: 32px auto;
        padding: 0 16px;
        line-height: 1.6;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 4px;
      }
      .hint {
        color: #888;
        font-size: 13px;
        margin-bottom: 20px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        padding: 8px 10px;
        font-size: 14px;
      }
      button {
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
      }
      section {
        margin-top: 18px;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 10px 12px;
      }
      section h2 {
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #888;
        margin: 0 0 6px;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
      }
      .muted {
        color: #888;
      }
      .answer {
        font-size: 15px;
      }
      #status {
        font-size: 12px;
        color: #0a7;
      }
    </style>
  </head>
  <body>
    <h1>AG-UI 最小 Demo</h1>
    <div class="hint">
      服务端 <code>node server.mjs</code> 监听 4311，Vite 把 <code>/agui</code> 代理过去。
    </div>

    <div class="row">
      <input id="input" value="AG-UI 是什么？" />
      <button id="send">发送</button>
    </div>
    <div id="status"></div>

    <section>
      <h2>Reasoning</h2>
      <pre id="reasoning" class="muted">（空）</pre>
    </section>

    <section>
      <h2>Tool Call</h2>
      <pre id="tool" class="muted">（空）</pre>
    </section>

    <section>
      <h2>Answer（增量拼接）</h2>
      <div id="answer" class="answer muted">（空）</div>
    </section>

    <section>
      <h2>State / Sources</h2>
      <pre id="state" class="muted">（空）</pre>
    </section>

    <section>
      <h2>Custom Events</h2>
      <pre id="custom" class="muted">（空）</pre>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
