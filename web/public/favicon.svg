<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="智能工作助手">
  <!--
    产品图标：圆角方底 + 对话气泡 + 三行内容线，对应「对话」与「知识/文档」两层能力。
    全部用路径绘制，不依赖字体或外部资源，任何系统显示一致；也避免了原来那份
    Vite 脚手架自带的紫色闪电图标（客户一眼就能看出是没改过的模板）。

    换客户品牌时只改两个颜色：
      #185FA5 = 品牌主色（底色与气泡内的线条）
      白色前景保持不变，深浅背景下都清晰。
    本文件在 web/public/ 下属于静态资源，改完必须重新构建前端产物才会生效。
  -->
  <rect width="48" height="48" rx="12" fill="#185FA5"/>
  <path d="M11 14a4 4 0 0 1 4-4h18a4 4 0 0 1 4 4v15a4 4 0 0 1-4 4H22l-7.5 6V33H15a4 4 0 0 1-4-4V14z" fill="#FFFFFF"/>
  <path d="M18 18h12M18 23h12M18 28h8" stroke="#185FA5" stroke-width="2.2" stroke-linecap="round"/>
</svg>
