# ============================================================================
# 私有化离线交付 · Compose 编排（命令均在「仓库根」执行，见文件末尾）
# ============================================================================
# 为什么单独放 deploy/ 且另建一份：server/docker-compose.yml 是早期只打后端的旧文件
# （build 上下文指向 server/、挂了 4 个卷、文件头自认「未经本机验证」），不要改它，
# 也不要复用它——离线交付要用根目录的 Dockerfile.offline 和「单卷」布局。
services:
  app:
    # build 上下文必须是仓库根（..）：Dockerfile.offline 要同时 COPY web/、server/、
    # model-cache/ 三处，只有根上下文才能取全。dockerfile 相对 context 定位。
    build:
      context: ..
      dockerfile: Dockerfile.offline
    # 镜像名固定为 latest，便于与 build-offline-bundle.sh 导出的 tag 对齐，
    # 客户机 docker load 后无需改本文件即可直接 up。
    image: ai-server-offline:latest
    # 离线镜像里已设 PORT=3000，这里做宿主机 → 容器的固定映射；
    # 客户现场若 3000 被占用，只改左侧宿主端口（如 "8080:3000"），右侧不要动。
    ports:
      - "3000:3000"
    # 敏感配置（DEEPSEEK_API_KEY / ADMIN_PASSWORD / IMAGE_SIGN_SECRET）不进镜像、
    # 不进编排文件，全部来自 deploy/.env（由 npm run setup 生成，已被 .gitignore 忽略）。
    # 注意：env_file 的相对路径以「本 compose 文件所在目录」为基准，即 deploy/.env，
    # 而不是执行 docker compose 时的 cwd——这正是命令里同时写 --env-file deploy/.env 的原因：
    # 前者注入容器，后者供 compose 自身做 ${} 插值（本文件没用插值，但保持显式更不易混淆）。
    env_file:
      - .env
    # 只挂一个卷：APP_DATA_DIR=/app/data 启用单卷布局后，app.db、images、uploads、
    # vector-index、backups、logs 全在这一个目录下面（见 server/paths.js），
    # 重建/升级镜像时数据不会丢。模型缓存在镜像层 /app/model-cache，刻意不挂卷——
    # 空卷会盖住内置模型，导致离线启动重新联网下载。
    volumes:
      - app-data:/app/data
    # 宿主机重启、容器异常退出都自动拉起，交付现场不需要人工值守。
    restart: unless-stopped
    # 显式用 /api/health 判定就绪（覆盖镜像内的 HEALTHCHECK，便于 docker compose ps
    # 直接看到 healthy/unhealthy）。用 node 内置 fetch 而不是 curl：slim 镜像没装 curl。
    # start_period 给足首次初始化向量库 + 加载 onnx 模型的时间，避免还没就绪就被判失败。
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

# 具名卷由 docker 管理，数据不落在宿主机项目目录里，
# 避免客户把仓库打包搬走时误删数据；升级镜像也不会影响卷内容。
volumes:
  app-data:

# ============================================================================
# 用法（在仓库根执行）：
#   npm run setup                        # 先生成 deploy/.env
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#   docker compose -f deploy/docker-compose.yml ps          # 查看健康状态
#   docker compose -f deploy/docker-compose.yml logs -f app # 查看日志
#
# 客户机「离线导入镜像」场景（已 docker load，无源码、不要加 --build）：
#   docker compose -f docker-compose.yml --env-file .env up -d
# ============================================================================
